server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve static files
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Example: if your backend is on /api and different host, you can proxy it
    # location /api/ {
    #     proxy_pass http://backend-service:8080;
    # }
}
